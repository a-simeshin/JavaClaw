spring:
  ai:
    openai:
      api-key: test-key
      base-url: http://localhost:9999
      chat:
        options:
          model: test-model
  datasource:
    url: jdbc:tc:postgresql:15:///javaclaw?TC_TMPFS=/var/lib/postgresql/data:rw
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: 5000

agent:
  workspace: classpath:test-workspace/
  onboarding:
    completed: true

javaclaw:
  chat:
    sse:
      timeout: 5s
      heartbeat-interval: 60s
      max-concurrent: 100

jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: false

management:
  endpoint:
    restart:
      enabled: false

logging:
  level:
    ai.javaclaw: DEBUG
    org.springframework.web: WARN
