spring:
  ai:
    openai:
      api-key: test-key
      base-url: http://localhost:9999
      chat:
        options:
          model: test-model
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: javaclaw-test
        version: 1.0.0
        type: SYNC
        streamable-http:
          mcp-endpoint: /api/mcp
  datasource:
    url: jdbc:tc:postgresql:15:///javaclaw?TC_TMPFS=/var/lib/postgresql/data:rw
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: 5000

agent:
  workspace: classpath:test-workspace/
  onboarding:
    completed: true

javaclaw:
  security:
    users:
      - username: admin
        password: admin
        role: ADMIN
      - username: user
        password: user
        role: USER
  chat:
    thinking:
      enabled: false
      budget-tokens: 10000
    fallback:
      enabled: false
      models: []
      max-retries-per-model: 1
    sse:
      timeout: 5s
      heartbeat-interval: 60s
      max-concurrent: 100

jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    restart:
      enabled: false
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    ai.javaclaw: DEBUG
    org.springframework.web: WARN
