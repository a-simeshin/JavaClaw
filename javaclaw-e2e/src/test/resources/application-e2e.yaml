# Profile for Playwright E2E tests (real browser + real LLM via OpenRouter).
# PostgreSQL datasource is provided via @ServiceConnection from Testcontainers.

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  ai:
    model:
      chat: openai
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        completions-path: /v1/chat/completions
        options:
          model: google/gemini-2.0-flash-001
    mcp:
      client:
        enabled: true

agent:
  onboarding:
    completed: true
  workspace: classpath:test-workspace/

jobrunr:
  dashboard:
    enabled: false
