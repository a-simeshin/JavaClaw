spring:
  ai:
    model:
      chat: openai
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        completions-path: /v1/chat/completions
        options:
          model: google/gemini-2.0-flash-001
    mcp:
      client:
        enabled: true
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javaclaw}
    username: ${DB_USERNAME:javaclaw}
    password: ${DB_PASSWORD:javaclaw}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
agent:
  onboarding:
    completed: true
  workspace: classpath:test-workspace/
