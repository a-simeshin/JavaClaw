spring:
  application:
    name: JavaClaw
  config:
    import: optional:classpath:application.private.yaml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javaclaw}
    username: ${DB_USERNAME:javaclaw}
    password: ${DB_PASSWORD:javaclaw}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: ${OPENROUTER_MODEL:minimax/minimax-m2.7}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

management:
  endpoint:
    restart:
      enabled: true

pebble:
  suffix: .html.peb
agent:
  onboarding:
    completed: true
  workspace: file:./workspace/
jobrunr:
  background-job-server:
    enabled: true
    worker-count: ${JOBRUNR_WORKER_COUNT:10}
  dashboard:
    enabled: true
    port: ${JOBRUNR_DASHBOARD_PORT:8081}
