plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'com.google.cloud.tools.jib' version '3.5.3'
}

dependencies {
    implementation project(':base')
    implementation project(':providers:anthropic')
    implementation project(':providers:google')
    implementation project(':providers:ollama')
    implementation project(':providers:openai')

    implementation project(':plugins:discord')
    implementation project(':plugins:telegram')
    implementation project(':plugins:playwright')
    implementation project(':plugins:brave')

    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'io.pebbletemplates:pebble-spring-boot-starter:4.1.1'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'com.microsoft.playwright:playwright:1.52.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // Ensure all tests run in the same JVM (never fork a new JVM per test class).
    // This is critical for E2E tests: the singleton PostgreSQL container, Spring context,
    // and Playwright browser are all JVM-scoped and must be shared across all test classes.
    forkEvery = 0
    maxParallelForks = 1

    // JVM args for faster startup
    jvmArgs '-XX:+TieredCompilation', '-XX:TieredStopAtLevel=1'

    // Forward OPENROUTER_API_KEY to the test JVM so @EnabledIfEnvironmentVariable picks it up
    environment 'OPENROUTER_API_KEY', System.getenv('OPENROUTER_API_KEY')
}

bootRun {
    workingDir = rootProject.projectDir
}

jib {
    to {
        image = 'jobrunr.io/javaclaw'
        tags = ['latest']
    }
    extraDirectories {
        paths {
            path {
                from = rootProject.file('workspace')
                into = '/workspace'
            }
            permissions = [
                    '/workspace': '755'
            ]
        }
    }
}
