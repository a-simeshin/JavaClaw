services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-javaclaw}
      DB_USERNAME: ${DB_USERNAME:-javaclaw}
      DB_PASSWORD: ${DB_PASSWORD:-javaclaw}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-javaclaw}
      POSTGRES_USER: ${DB_USERNAME:-javaclaw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-javaclaw}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-javaclaw}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
