server:
  shutdown: graceful

spring:
  application:
    name: JavaClaw
  config:
    import: optional:classpath:application.private.yaml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      request-timeout: -1
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javaclaw}
    username: ${DB_USERNAME:javaclaw}
    password: ${DB_PASSWORD:javaclaw}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: ${OPENROUTER_MODEL:minimax/minimax-m2.7}
    mcp:
      server:
        enabled: ${MCP_SERVER_ENABLED:true}
        protocol: STREAMABLE
        name: javaclaw
        version: 1.0.0
        type: SYNC
        instructions: "JavaClaw AI Agent Platform — provides file management, skills, and conversation tools"
        streamable-http:
          mcp-endpoint: /api/mcp
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    restart:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: JavaClaw
    description: Enterprise AI Agent Platform
    version: 1.0.0-SNAPSHOT

agent:
  onboarding:
    completed: true
  workspace: file:./workspace/
javaclaw:
  security:
    users:
      - username: admin
        password: admin
        role: ADMIN
      - username: user
        password: user
        role: USER
  chat:
    thinking:
      enabled: ${THINKING_ENABLED:false}
      budget-tokens: ${THINKING_BUDGET_TOKENS:10000}
    token-budget:
      max-context-tokens: 200000
      reserved-for-response: 8000
      reserved-for-tools: 4000
    fallback:
      enabled: ${MODEL_FALLBACK_ENABLED:false}
      models: ${MODEL_FALLBACK_MODELS:}
      max-retries-per-model: ${MODEL_FALLBACK_MAX_RETRIES:1}
    sse:
      timeout: 30m
      heartbeat-interval: 15s
      max-concurrent: 1000
jobrunr:
  background-job-server:
    enabled: true
    worker-count: ${JOBRUNR_WORKER_COUNT:10}
  dashboard:
    enabled: true
    port: ${JOBRUNR_DASHBOARD_PORT:8081}
