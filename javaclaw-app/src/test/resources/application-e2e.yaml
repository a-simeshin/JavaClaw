# Profile for E2E Playwright tests.
# Database properties are provided via @ServiceConnection from Testcontainers.
# LLM provider properties are overridden by @DynamicPropertySource from env vars.

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: openai
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        completions-path: /v1/chat/completions
        options:
          model: google/gemini-2.0-flash-001
    mcp:
      client:
        enabled: true
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

agent:
  workspace: classpath:test-workspace/

jobrunr:
  dashboard:
    enabled: false
