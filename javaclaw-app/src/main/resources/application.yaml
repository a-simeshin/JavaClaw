server:
  shutdown: graceful

spring:
  application:
    name: JavaClaw
  config:
    import: optional:classpath:application.private.yaml
  profiles:
    # Local dev and production default to the PostgreSQL profile so existing
    # workflows keep working after multi-dialect refactor (Task #17).
    # Override with SPRING_PROFILES_ACTIVE or -Dspring-boot.run.profiles.
    default: postgres
    group:
      # Activating `debug` implicitly activates `sqlite` (dialect + driver),
      # while application-debug.yaml only overrides SQLITE_FILE to a tmpdir
      # path so debug sessions never clobber the normal sqlite profile DB.
      debug: sqlite
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      request-timeout: -1
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: ${OPENROUTER_MODEL:minimax/minimax-m2.7}
    mcp:
      server:
        enabled: ${MCP_SERVER_ENABLED:true}
        protocol: STREAMABLE
        name: javaclaw
        version: 1.0.0
        type: SYNC
        instructions: "JavaClaw AI Agent Platform — provides file management, skills, and conversation tools"
        streamable-http:
          mcp-endpoint: /api/mcp
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    restart:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: JavaClaw
    description: Enterprise AI Agent Platform
    version: 1.0.0-SNAPSHOT

agent:
  onboarding:
    completed: true
  workspace: file:./workspace/
javaclaw:
  security:
    users:
      - username: admin
        password: admin
        role: ADMIN
      - username: user
        password: user
        role: USER
  chat:
    thinking:
      enabled: ${THINKING_ENABLED:false}
      budget-tokens: ${THINKING_BUDGET_TOKENS:10000}
    token-budget:
      max-context-tokens: 200000
      reserved-for-response: 8000
      reserved-for-tools: 4000
    fallback:
      enabled: ${MODEL_FALLBACK_ENABLED:false}
      models: ${MODEL_FALLBACK_MODELS:}
      max-retries-per-model: ${MODEL_FALLBACK_MAX_RETRIES:1}
    tool-deny:
      enabled: ${TOOL_DENY_ENABLED:true}
      global-patterns:
        - "rm\\s+-rf\\s+/"
        - "DROP\\s+TABLE"
        - "DELETE\\s+FROM\\s+\\w+\\s*;"
        - "TRUNCATE\\s+TABLE"
        - "chmod\\s+777"
        - "curl.*\\|.*sh"
        - "wget.*\\|.*sh"
      per-tool:
        writeFile:
          - "\\.sh[\"\\s}]"
          - "\\.bash[\"\\s}]"
          - "\\.exe[\"\\s}]"
          - "\\.jar[\"\\s}]"
          - "\\.class[\"\\s}]"
        deleteFile:
          - "AGENT\\.md"
          - "SOUL\\.md"
          - "INFO\\.md"
    sse:
      timeout: 30m
      heartbeat-interval: 15s
      max-concurrent: 1000
  reasoning:
    enabled: true
    effort: medium

jobrunr:
  background-job-server:
    enabled: true
    worker-count: ${JOBRUNR_WORKER_COUNT:10}
  dashboard:
    enabled: true
    port: ${JOBRUNR_DASHBOARD_PORT:8081}
